# Mirror this Azure Repos repository to GitHub (__GITHUB_REPO__).
#
# Azure DevOps stays the source of truth; GitHub is a read-only mirror. Runs on every
# push to any branch or tag, plus a nightly safety net, and force-pushes
# refs/heads/* + refs/tags/* with --prune so deletions and rebases propagate.
# refs/pull/* (ADO PR merge refs) are excluded: GitHub rejects that namespace.
#
# Prerequisites (Azure DevOps project that owns this repo):
#   1. Variable group '__VARIABLE_GROUP__' with secret variable __TOKEN_VARIABLE__: a
#      fine-grained GitHub PAT for __GITHUB_REPO__ with Contents: Read and write,
#      SSO-authorized for the org. Rotate it in the variable group, never in YAML.
#   2. The pipeline is authorized to use that variable group (first run prompts).
#   3. Hosted pool: github.com egress is not guaranteed from in-VNet self-hosted
#      agents, so this runs on Microsoft-hosted ubuntu-latest.
#
# Register with:
#   az pipelines create --name mirror-github --yml-path /.azure-pipeline-mirror-github.yaml \
#     --repository <repo> --repository-type tfsgit --branch main --skip-first-run

trigger:
  branches:
    include:
      - '*'
  tags:
    include:
      - '*'
pr: none

schedules:
  - cron: '0 3 * * *' # 03:00 UTC nightly safety net
    displayName: Nightly full re-sync
    branches:
      include:
        - main
    always: true

variables:
  - group: __VARIABLE_GROUP__
  - name: GITHUB_REPO
    value: __GITHUB_REPO__

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: none

  - bash: |
      set -euo pipefail
      SRC="$(System.CollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)"
      WORK="$(mktemp -d)"
      trap 'rm -rf "$WORK"' EXIT

      # Bare clone = refs/heads/* + refs/tags/* only (skips refs/pull/*).
      git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
        clone --quiet --bare "$SRC" "$WORK/src.git"
      cd "$WORK/src.git"

      # Token travels via a credential helper, never on the command line or in the URL.
      git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_MIRROR_TOKEN}"; }; f'
      DST="https://github.com/${GITHUB_REPO}.git"

      git push --force --prune "$DST" \
        '+refs/heads/*:refs/heads/*' \
        '+refs/tags/*:refs/tags/*'

      # Verify: every branch and tag SHA matches on both sides.
      git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > "$WORK/want"
      git ls-remote "$DST" 'refs/heads/*' 'refs/tags/*' | grep -v '\^{}$' | tr '\t' ' ' | sort > "$WORK/got"
      echo "refs: source=$(wc -l < "$WORK/want") github=$(wc -l < "$WORK/got")"
      diff "$WORK/want" "$WORK/got" || { echo "##vso[task.logissue type=error]ref mismatch after push"; exit 1; }
    displayName: Mirror branches and tags to GitHub
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      GITHUB_MIRROR_TOKEN: $(__TOKEN_VARIABLE__)
