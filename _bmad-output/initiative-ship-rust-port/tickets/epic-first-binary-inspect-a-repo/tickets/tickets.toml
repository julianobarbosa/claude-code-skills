[[entry]]
id = 2
type = "story"
title = "Audit delivery scope with ship preflight"
description = "ship preflight reports what would be delivered and whether files outside the change are left behind."
verify = "preflight prints branch, commits_ahead_of_upstream, staged, unstaged, untracked and scope_clean matching ship-preflight.ts, and exits 0 in every case including no upstream."
covers = ["R2"]
after = []
hitl = false
risk = "low"
v6_key = "1-2-audit-delivery-scope-with-ship-preflight"

[[entry]]
