type = "story"
title = "Detect the delivery platform with ship detect"
description = "ship detect reports the platform, remote, Azure coordinates, branch and inferred work item of the repo it runs in."
verify = "detect prints the same keys, values and line order as ship-detect.ts in an Azure clone and a GitHub clone, and SHIP_PLATFORM overrides detection."
covers = ["R1"]
