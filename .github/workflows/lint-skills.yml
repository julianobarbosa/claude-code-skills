name: lint-skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/lint-skills.ts'
      - '.github/workflows/lint-skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/lint-skills.ts'
      - '.github/workflows/lint-skills.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run skills lint
        run: bun scripts/lint-skills.ts skills
